name: tradebridge

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./env.example
      - path: ./.env
        required: false
    environment:
      APP_ENV: docker
      APP_BASE_PATH: ${APP_BASE_PATH:-/tradebridge}
      # These paths must match the frontend and the persistent volume.
      API_PREFIX: /api/v1
      DATABASE_PATH: /app/data/tradebridge.db
    volumes:
      - tradebridge-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import json, os, urllib.request; base=os.environ.get('APP_BASE_PATH', '/tradebridge').rstrip('/'); assert json.load(urllib.request.urlopen('http://127.0.0.1:8000'+base+'/api/v1/health', timeout=3))['status'] == 'ok'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        APP_BASE_PATH: ${APP_BASE_PATH:-/tradebridge}
    restart: unless-stopped
    environment:
      LOCAL_PROXY_TOKEN: ${LOCAL_PROXY_TOKEN:?Set LOCAL_PROXY_TOKEN in .env}
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
      - "127.0.0.1:${AUTH_PORT:-8081}:8081"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "base=$$(cat /etc/nginx/app-base-path); wget -q -O /dev/null http://127.0.0.1:8080$$base/ && wget -q -O /dev/null http://127.0.0.1:8080$$base/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  tradebridge-data:
