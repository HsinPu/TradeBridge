# The outer proxy must preserve the public Host and replace forwarding headers.
map $http_x_forwarded_proto $public_scheme {
    default $scheme;
    http http;
    https https;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    # Resolve again after Compose recreates the backend with a new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    # Preserve the public path; FastAPI root_path handles route matching.
    location ~ ^${APP_BASE_PATH}/(api(?:/|$)|docs(?:/|$)|redoc(?:/|$)|openapi\.json$) {
        include /etc/nginx/tradebridge-proxy.conf;
    }
    # Legacy API calls retain their methods and request bodies.
    location ~ ^/api(?:/|$) {
        include /etc/nginx/tradebridge-proxy.conf;
    }
    location ~ ^/(docs(?:/|$)|redoc(?:/|$)|openapi\.json$) {
        return 308 ${APP_BASE_PATH}$request_uri;
    }
    location = / {
        return 308 ${APP_BASE_PATH}/$is_args$args;
    }
    location = ${APP_BASE_PATH} {
        return 308 ${APP_BASE_PATH}/$is_args$args;
    }
    location ${APP_BASE_PATH}/assets/ {
        rewrite ^${APP_BASE_PATH}/(.*)$ /$1 break;
        try_files $uri =404;
    }
    location ${APP_BASE_PATH}/ {
        rewrite ^${APP_BASE_PATH}/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }
    location = /index.html {
        internal;
    }
    location / {
        return 404;
    }
}
