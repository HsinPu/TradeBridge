# The outer proxy must preserve the public Host and replace forwarding headers.
map $http_x_forwarded_proto $public_scheme {
    default $scheme;
    http http;
    https https;
}

# Local-only published port: do not connect a public reverse proxy here.
server {
    listen 8080;
    if ($host !~ ^(localhost|127\.0\.0\.1)$) { return 403; }
    set $local_access "${LOCAL_PROXY_TOKEN}";
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;
    include /etc/nginx/tradebridge-routes.conf;
}
# The public reverse proxy must connect to this protected listener.
server {
    listen 8081;
    set $local_access "";
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;
    include /etc/nginx/tradebridge-routes.conf;
}
