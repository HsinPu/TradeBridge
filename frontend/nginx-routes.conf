    # Preserve the public path; FastAPI root_path handles route matching.
    location ~ ^${APP_BASE_PATH}/(api(?:/|$)|docs(?:/|$)|redoc(?:/|$)|openapi\.json$) {
        include /etc/nginx/tradebridge-proxy.conf;
    }
    location = ${APP_BASE_PATH} {
        return 308 ${APP_BASE_PATH}/$is_args$args;
    }
    location ${APP_BASE_PATH}/assets/ {
        rewrite ^${APP_BASE_PATH}/(.*)$ /$1 break;
        try_files $uri =404;
    }
    location ${APP_BASE_PATH}/ {
        rewrite ^${APP_BASE_PATH}/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }
    location = /index.html {
        internal;
    }
    location / {
        return 404;
    }
