proxy_pass $backend;
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $public_scheme;
proxy_read_timeout 600s;
# Always replace caller-supplied trust headers on both listeners.
proxy_set_header X-TradeBridge-Local-Token $local_access;
proxy_set_header X-TradeBridge-Proxy-Token "${LOCAL_PROXY_TOKEN}";
proxy_set_header X-TradeBridge-Client-IP $remote_addr;
